plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yuedu.reading'
    compileSdk 34

    defaultConfig {
        applicationId "com.yuedu.reading"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // CI 产物用一个自动生成的 debug 签名，保证下载即可安装（正式分发请换自持 keystore）
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 本工程是纯原生壳（WebView + 系统 API），不依赖任何第三方库。
dependencies {
}
