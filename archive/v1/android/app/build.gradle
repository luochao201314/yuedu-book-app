plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.englishbook'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.englishbook"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // 用 Android 自动生成的 debug 签名，保证打出的 release APK 可直接安装（无需自建 keystore）
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // WebViewAssetLoader：以 https 安全上下文加载本地资源，使 WebView 内麦克风(getUserMedia)可用
    implementation 'androidx.webkit:webkit:1.10.0'
}
