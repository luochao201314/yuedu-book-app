name: Build Android APK

on:
  workflow_dispatch:        # 可在 GitHub Actions 页面手动触发
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'
          accept-android-sdk-licenses: true

      # 用 Gradle 发行版直接构建，省掉仓库里的 wrapper 二进制
      - name: Install Gradle 8.6
        run: |
          curl -sL -o gradle.zip https://services.gradle.org/distributions/gradle-8.6-bin.zip
          unzip -q gradle.zip -d "$HOME/gradle-home"
          echo "$HOME/gradle-home/gradle-8.6/bin" >> "$GITHUB_PATH"

      # app/index.html 是 app/src 的构建产物：这里校验它没有和源码漂移
      - name: Rebuild web bundle and check for drift
        run: |
          node tools/build-www.js
          git diff --exit-code -- app/index.html

      # 单文件前端放进 APK 资源目录（MainActivity 从 assets/index.html 读取）
      - name: Sync web assets into APK
        run: |
          mkdir -p android/app/src/main/assets
          cp app/index.html android/app/src/main/assets/index.html

      - name: Point Gradle to Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build release APK (debug-signed, installable as-is)
        run: |
          cd android
          gradle assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yuedu-book-apk
          path: android/app/build/outputs/apk/release/*.apk
