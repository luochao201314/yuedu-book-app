name: Build Android APK

on:
  workflow_dispatch:        # 允许在 GitHub Actions 页面手动触发
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'
          accept-android-sdk-licenses: true

      # 云端无 Android Studio，用 Gradle 发行版直接构建（无需本地 Gradle Wrapper 二进制）
      - name: Install Gradle 8.6
        run: |
          curl -sL -o gradle.zip https://services.gradle.org/distributions/gradle-8.6-bin.zip
          unzip -q gradle.zip -d "$HOME/gradle-home"
          echo "$HOME/gradle-home/gradle-8.6/bin" >> "$GITHUB_PATH"

      # 把最新的 Web 前端同步进 APK 资源目录
      - name: Sync web assets into APK
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r app/* android/app/src/main/assets/www/

      - name: Point Gradle to Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build release APK (auto-signed with debug key → 可直接安装)
        run: |
          cd android
          gradle assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yuedu-book-apk
          path: android/app/build/outputs/apk/release/*.apk
